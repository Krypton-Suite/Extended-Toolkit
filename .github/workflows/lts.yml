# KILL-SWITCH: Set repository variable LTS_DISABLED=true to disable.
# Runs on push to V120-LTS (or workflow_dispatch). Does not run on a schedule.
#
# NUGET: Trusted publishing via NuGet/login. Secret NUGET_USER is the nuget.org profile name.
# nuget.org needs a policy for this workflow file and Krypton-Suite/Extended-Toolkit.
#
# Discord: Set secret DISCORD_WEBHOOK_LTS (optional; falls back to DISCORD_WEBHOOK_MASTER).

name: LTS Release

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - V120-LTS
  workflow_dispatch:
    inputs:
      pack_lite:
        description: Also pack LTSLite packages
        required: false
        default: false
        type: boolean
      publish_nuget:
        description: Publish to NuGet.org
        required: false
        default: true
        type: boolean

jobs:
  lts:
    name: Pack LTS
    runs-on: windows-latest
    if: vars.LTS_DISABLED != 'true'
    concurrency:
      group: lts-release
      cancel-in-progress: true

    steps:
      - name: Verify branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -notmatch '^refs/heads/V\d+-LTS$') {
            Write-Error "LTS release only runs from an LTS branch (e.g. 'V120-LTS'). Current ref: '$env:GITHUB_REF'. For manual run, select branch 'V120-LTS' in the workflow dispatch."
          }
          Write-Host "Branch verified: $env:GITHUB_REF"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Standard-Toolkit submodule
        shell: pwsh
        run: ./Scripts/CI/Checkout-StandardToolkit.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Setup .NET 11 (stable)
        id: setup_dotnet11_stable
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '11.0.x' }}

      - name: Setup .NET 11 (preview fallback)
        if: steps.setup_dotnet11_stable.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '11.0.x' }}
          dotnet-quality: preview

      - name: Pin SDK via global.json
        shell: pwsh
        run: ./Scripts/CI/Pin-DotNetSdk.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-lts-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-lts-
            ${{ runner.os }}-nuget-

      - name: Pack LTS
        run: msbuild /m Scripts/Build/lts.proj /t:Pack /p:Configuration=LTS /p:Platform="Any CPU"

      - name: Pack LTSLite
        if: github.event_name == 'workflow_dispatch' && inputs.pack_lite
        run: msbuild /m Scripts/Build/lts.proj /t:PackLite /p:Configuration=LTS /p:Platform="Any CPU"

      - name: List packages
        shell: pwsh
        run: |
          $dir = 'Bin/NuGet Packages/LTS'
          if (Test-Path $dir) {
            Get-ChildItem $dir -Filter '*.nupkg' | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Error "No packages produced at $dir"
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: LTS-packages
          path: |
            Bin/NuGet Packages/LTS/*.nupkg
            Bin/NuGet Packages/LTS/*.snupkg
          retention-days: 30

      - name: NuGet login (OIDC)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget)) && github.repository == 'Krypton-Suite/Extended-Toolkit'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
        id: push_nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Krypton-Suite/Extended-Toolkit') {
            Write-Warning "NuGet trusted publishing is only configured for Krypton-Suite/Extended-Toolkit - skipping NuGet push"
            echo "packages_published=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $env:NUGET_API_KEY) {
            Write-Error 'NuGet trusted publishing did not provide an API key. Set the NUGET_USER secret to the nuget.org profile name.'
          }
          $packages = @(Get-ChildItem 'Bin/NuGet Packages/LTS' -Filter '*.nupkg' -Exclude '*.symbols.nupkg')
          $publishedAny = $false
          foreach ($pkg in $packages) {
            Write-Host "Publishing $($pkg.Name)"
            $output = dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1 | Out-String
            Write-Host $output
            if ($output -notmatch 'already exists' -and $output -notmatch 'was not pushed') {
              $publishedAny = $true
            }
          }
          echo "packages_published=$publishedAny" >> $env:GITHUB_OUTPUT

      - name: Resolve package version
        if: always() && steps.push_nuget.outcome == 'success'
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-ChildItem 'Bin/NuGet Packages/LTS' -Filter 'Krypton.Toolkit.Suite.Extended.Ultimate.LTS.*.nupkg' |
            Where-Object { $_.Name -notmatch '\.symbols\.' } |
            Select-Object -First 1
          if (-not $pkg) {
            $pkg = Get-ChildItem 'Bin/NuGet Packages/LTS' -Filter '*.nupkg' |
              Where-Object { $_.Name -notmatch '\.symbols\.' } |
              Select-Object -First 1
          }
          $version = if ($pkg -and $pkg.BaseName -match '(\d+\.\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?)') { $Matches[1] } else { 'unknown' }
          Write-Host "Version=$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Announce LTS Release on Discord
        if: steps.push_nuget.outputs.packages_published == 'True'
        shell: pwsh
        env:
          DISCORD_WEBHOOK_LTS: ${{ secrets.DISCORD_WEBHOOK_LTS }}
          DISCORD_WEBHOOK_MASTER: ${{ secrets.DISCORD_WEBHOOK_MASTER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $webhook = $env:DISCORD_WEBHOOK_LTS
          if (-not $webhook) { $webhook = $env:DISCORD_WEBHOOK_MASTER }
          if (-not $webhook) {
            Write-Warning 'DISCORD_WEBHOOK_LTS (and DISCORD_WEBHOOK_MASTER) not set - skipping Discord notification'
            exit 0
          }

          $sha = (git rev-parse HEAD).Trim()
          $shortSha = $sha.Substring(0, [Math]::Min(7, $sha.Length))
          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$sha"
          $version = '${{ steps.get_version.outputs.version }}'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $payload = @{
            embeds = @(
              @{
                title       = 'Krypton Extended Toolkit LTS Release'
                url         = $commitUrl
                description = 'A new Extended Toolkit long-term support (LTS) build is now on NuGet.org.'
                color       = 3050327
                fields      = @(
                  @{ name = 'Version'; value = "``$version``"; inline = $true }
                  @{ name = 'Commit'; value = "[``$shortSha``]($commitUrl)"; inline = $true }
                  @{
                    name   = 'NuGet Packages'
                    value  = @(
                      '• [Ultimate.LTS](https://www.nuget.org/packages/Krypton.Toolkit.Suite.Extended.Ultimate.LTS)'
                      '• [Common.LTS](https://www.nuget.org/packages/Krypton.Toolkit.Suite.Extended.Common.LTS)'
                      '• [Controls.LTS](https://www.nuget.org/packages/Krypton.Toolkit.Suite.Extended.Controls.LTS)'
                      '• [Module dashboard](https://github.com/Krypton-Suite/Krypton-Toolkit-Suite-Version-Dashboard/blob/main/Documents/Modules/Extended/Krypton-Toolkit-Suite-Extended-Modules.md)'
                    ) -join "`n"
                    inline = $false
                  }
                  @{
                    name   = 'Target Frameworks'
                    value  = "• .NET Framework 4.7.2`n• .NET Framework 4.8`n• .NET Framework 4.8.1`n• .NET 10–11 (windows)"
                    inline = $false
                  }
                  @{
                    name   = 'Changelog'
                    value  = '[Documents/Help/Changelog.md](https://github.com/Krypton-Suite/Extended-Toolkit/blob/V120-LTS/Documents/Help/Changelog.md)'
                    inline = $false
                  }
                  @{
                    name   = 'Workflow'
                    value  = "[Run #$env:GITHUB_RUN_NUMBER]($runUrl)"
                    inline = $false
                  }
                )
                footer    = @{ text = 'Extended Toolkit LTS' }
                timestamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod -Uri $webhook -Method Post -Body $payload -ContentType 'application/json'
          Write-Host 'Discord LTS announcement sent.'
