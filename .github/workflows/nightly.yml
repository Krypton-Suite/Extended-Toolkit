name: Nightly Release

permissions:
  contents: read

on:
  schedule:
    - cron: '42 23 * * *'
  workflow_dispatch:
    inputs:
      pack_lite:
        description: Also pack NightlyLite packages
        required: false
        default: false
        type: boolean
      publish_nuget:
        description: Publish to NuGet.org
        required: false
        default: false
        type: boolean

jobs:
  nightly:
    name: Pack Nightly
    runs-on: windows-latest
    if: vars.NIGHTLY_DISABLED != 'true'
    concurrency:
      group: nightly-alpha
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'alpha' || github.ref }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Setup .NET 11 (stable)
        id: setup_dotnet11_stable
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '11.0.x' }}

      - name: Setup .NET 11 (preview fallback)
        if: steps.setup_dotnet11_stable.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '11.0.x' }}
          dotnet-quality: preview

      - name: Pin SDK via global.json
        shell: pwsh
        run: ./Scripts/CI/Pin-DotNetSdk.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack Nightly
        run: msbuild /m Scripts/Build/nightly.proj /t:Pack /p:Platform="Any CPU"

      - name: Pack NightlyLite
        if: github.event_name == 'workflow_dispatch' && inputs.pack_lite
        run: msbuild /m Scripts/Build/nightly.proj /t:PackLite /p:Platform="Any CPU"

      - name: List packages
        shell: pwsh
        run: |
          $dir = 'Bin/NuGet Packages/Nightly'
          if (Test-Path $dir) {
            Get-ChildItem $dir -Filter '*.nupkg' | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Error "No packages produced at $dir"
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: Nightly-packages
          path: |
            Bin/NuGet Packages/Nightly/*.nupkg
            Bin/NuGet Packages/Nightly/*.snupkg
          retention-days: 14

      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Error 'NUGET_API_KEY secret is not set.'
          }
          Get-ChildItem 'Bin/NuGet Packages/Nightly' -Filter '*.nupkg' -Exclude '*.symbols.nupkg' | ForEach-Object {
            Write-Host "Publishing $($_.Name)"
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
